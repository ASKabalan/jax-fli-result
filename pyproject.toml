[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
name = "jax-fli-launcher"
description = "Streamlit GUI launcher for jax-fli simulation jobs"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "jax-fli[catalog,plot]",
    "streamlit>=1.30",
    "plotly>=5.0",
    "matplotlib>=3.0",
]

[dependency-groups]
dev = ["prek", "pyright", "ruff", "toml-sort"]

[tool.uv]
# Don't install any dependency group by default (uv's built-in default is ["dev"]).
default-groups = []

# Consume jax-fli from git. uv propagates a git dependency's own [tool.uv.sources]
# transitively, so jax-fli's fork pins for jaxpm / jax-cosmo / s2fft (the forks the
# Analysis tab needs) resolve automatically from jax-fli's pyproject — no need to (and we
# must not) redeclare them here, which would raise a "conflicting URLs" error. uv strips
# sources at build time, so the published wheel depends only on the plain PyPI names.
[tool.uv.sources]
jax-fli = { git = "https://github.com/ASKabalan/jax-fli" }

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "README.md"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F821"]
"app/**/*.py" = ["E402"]
"app/*.py" = ["E402"]

[tool.pyright]
reportMissingImports = "none"

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.21"
          enable-cache: true
          python-version: "3.11"

      # prek reads .pre-commit-config.yaml and provisions each hook's own pinned env,
      # so there's no need to install the project (or the jax-fli forks) here.
      - name: Run prek
        run: uvx prek run --all-files
